version: '3.8'

services:
  frontend:
    build: ./frontend
    restart: always

  backend:
    build: ./backend
    environment:
      - DB_HOST=db
      - DB_NAME=todo_db
      - DB_USER=devops_user
      - DB_PASS=super_password
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=todo_db
      - POSTGRES_USER=devops_user
      - POSTGRES_PASSWORD=super_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  postgres_data: